body:
  - type: markdown
    attributes:
      value: |
        # Show and Tell

        Share what you've built with Termux Bootstrap!
        Custom profiles, modules, scripts, or workflows.

  - type: textarea
    id: description
    attributes:
      label: What did you build?
      placeholder: "I created a custom profile for..."
    validations:
      required: true

  - type: textarea
    id: highlights
    attributes:
      label: Highlights
      description: What makes it interesting?
      placeholder: "It includes..."
    validations:
      required: false

  - type: textarea
    id: code
    attributes:
      label: Code / Configuration
      description: Share relevant code snippets
      render: shell
    validations:
      required: false
