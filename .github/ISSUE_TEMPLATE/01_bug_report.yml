
name: Bug Report
description: Report a bug or unexpected behavior
title: "bug: "
labels: ["bug", "triage"]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Before submitting, please search existing issues to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Exact steps to reproduce the behavior
      placeholder: |
        1. Run './bootstrap.sh ...'
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Run `cat ~/.local/share/termux-bootstrap/logs/error.log` and paste the output
      render: shell
    validations:
      required: false

  - type: input
    id: doctor
    attributes:
      label: Doctor Output
      description: Run `./bootstrap.sh doctor --verbose` and paste the output
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Termux Bootstrap Version
      description: What version are you running? (run `./bootstrap.sh version`)
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: input
    id: termux-version
    attributes:
      label: Termux Version
      description: What Termux version? (run `termux-info | head -5`)
      placeholder: "0.119.0"
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android Version
      description: What Android version and device?
      placeholder: "Android 14, Pixel 8"
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Affected Profile/Module
      description: Which profile or module is affected?
      multiple: true
      options:
        - minimal
        - dev
        - full
        - developer
        - pentester
        - osint
        - reverse
        - ai
        - Other (specify in description)
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checks
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have checked the FAQ for common issues
          required: true
        - label: I am running the latest version
          required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or files
    validations:
      required: false
