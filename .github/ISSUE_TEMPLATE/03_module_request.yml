
name: Module / Profile Request
description: Request a new module or profile
title: "module: "
labels: ["module"]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for requesting a new module or profile!

  - type: dropdown
    id: type
    attributes:
      label: Request Type
      description: What are you requesting?
      options:
        - New module
        - New profile
        - Module enhancement
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name
      description: Suggested name (e.g., `cybersecurity/forensics`)
      placeholder: "cybersecurity/forensics"
    validations:
      required: true

  - type: textarea
    id: tools
    attributes:
      label: Tools / Packages
      description: List the tools or packages this module/profile should include
      placeholder: |
        - tool1
        - tool2
        - tool3
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: What workflow or scenario is this for?
      placeholder: "Digital forensics investigation workflow"
    validations:
      required: true

  - type: dropdown
    id: dependencies
    attributes:
      label: Dependencies
      description: What existing modules would this depend on?
      multiple: true
      options:
        - core/base
        - core/shell
        - core/editors
        - core/utils
        - development/python
        - development/nodejs
        - development/rust
        - development/golang
        - development/containers
        - cybersecurity/pentest
        - cybersecurity/recon
        - cybersecurity/osint
        - cybersecurity/reverse
        - cybersecurity/wireless
        - cybersecurity/threat-hunting
        - cybersecurity/mobile
        - ai/ai
        - None
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checks
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have checked existing modules/profiles for overlap
          required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links to tools, documentation, or references
    validations:
      required: false
