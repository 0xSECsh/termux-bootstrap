
name: Feature Request
description: Suggest a new feature or enhancement
title: "feat: "
labels: ["enhancement"]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
        Before submitting, please search existing issues to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Describe the use case.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work? Be as specific as possible.
      placeholder: "A new command/flag that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: What alternatives have you considered?
      placeholder: "I also considered..."
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What area does this affect?
      multiple: true
      options:
        - New CLI command
        - New module
        - New profile
        - Framework change
        - Configuration engine
        - Documentation
        - CI/CD
        - Testing
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checks
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I am willing to contribute this feature (optional)
          required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, examples from other projects, or references
    validations:
      required: false
