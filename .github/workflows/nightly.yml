# ==============================================================================
# Nightly — Scheduled Deep Validation
# ==============================================================================
# Runs overnight with extended coverage, multi-bash-version matrix, and
# performance regression detection. Can also be triggered manually.
# ==============================================================================

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    name: Nightly
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            jq \
            shellcheck \
            tar \
            gzip \
            xz-utils \
            zip \
            unzip

      - name: Install BATS
        run: sudo npm install -g bats

      - name: Install shfmt
        run: |
          curl -sSLO "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64"
          chmod +x shfmt_v3.10.0_linux_amd64
          sudo mv shfmt_v3.10.0_linux_amd64 /usr/local/bin/shfmt

      - name: ShellCheck All Files
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            if ! shellcheck -x -s bash "$f" 2>&1; then
              echo "::error file=$f::ShellCheck failed"
              failed=$((failed + 1))
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -not -path './node_modules/*' -not -path './target/*' -type f -print0)
          exit "$failed"

      - name: Run Extended BATS Tests
        id: bats
        continue-on-error: true
        run: |
          bats --formatter tap \
            tests/framework/ \
            tests/utils/ \
            tests/cli/ \
            tests/config/ \
            tests/logging/ \
            tests/modules/ \
            tests/profiles/ \
            tests/regression/ \
            tests/system/ \
            tests/terminal/ \
            tests/validation/ \
            tests/integration/

      - name: Performance Baseline Check
        id: perf
        run: |
          start_ts="$(date +%s%N)"
          bash -n lib/*.sh modules/*.sh commands/*.sh 2>/dev/null
          end_ts="$(date +%s%N)"
          elapsed_ms="$(( (end_ts - start_ts) / 1000000 ))"
          echo "TIME_MS=${elapsed_ms}" >> "${GITHUB_OUTPUT}"
          echo "### Performance" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Syntax check time:** ${elapsed_ms}ms" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: test-reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::notice::Nightly pipeline failed. Check artifacts and logs."
